{%- comment -%} 站点自定义 <head> 注入：调小文章页标题字号 {%- endcomment -%}
<style>
  h1.post-title { font-size: 2.6rem !important; line-height: 1.5 !important; }
  @media (min-width: 30rem) { h1.post-title { font-size: 1.6rem !important; } }


  /* 正文 Markdown 标题字号微调（h1 受主题“大标题特性”影响最大） */
  .content h1:not(.post-title) { font-size: 1.5rem !important; line-height: 1.35 !important; }
  .content h2 { font-size: 1.25rem !important; line-height: 1.4 !important; }
  .content h3 { font-size: 1.15rem !important; line-height: 1.5 !important; }



  /* ===== 悬浮目录 (右上角) ===== */
  #hj-toc-btn {
    position: fixed; top: 5.2rem; right: 1.1rem; z-index: 950;
    font-size: .8rem; padding: .38rem .85rem; cursor: pointer;
    color: #fff; background: rgba(20,64,84,.85);
    border: 1px solid rgba(255,255,255,.3); border-radius: 999px;
    box-shadow: 0 2px 8px rgba(0,0,0,.22); line-height: 1.2;
  }
  #hj-toc-btn:hover { background: rgba(20,64,84,1); }
  #hj-toc {
    display: none; position: fixed; top: 7.7rem; right: 1.1rem; z-index: 950;
    width: 17rem; max-height: min(60vh, 34rem); overflow: auto;
    padding: .6rem .8rem; background: rgba(255,255,255,.97);
    border: 1px solid rgba(0,0,0,.14); border-radius: .6rem;
    box-shadow: 0 6px 22px rgba(0,0,0,.18);
    font-size: .82rem; line-height: 1.55; color: #333;
  }
  #hj-toc.open { display: block; }
  #hj-toc ul { list-style: none; margin: 0; padding: 0; }
  #hj-toc li { margin: .08rem 0; }

  #hj-toc a {
    display: block; padding: .1rem .35rem; color: #3f5a6e;
    text-decoration: none; border-left: 2px solid transparent; border-radius: 3px;
  }
  #hj-toc a:hover { color: #111; background: rgba(79,177,186,.12); }
  #hj-toc a.active { color: #0a7f8c; border-left-color: #4fb1ba; background: rgba(79,177,186,.10); }
  @media (max-width: 48rem) {
    #hj-toc-btn { right: .6rem; }
    #hj-toc { right: .6rem; width: 15rem; }
  }
  @media (prefers-color-scheme: dark) {
    #hj-toc { background: rgba(18,22,26,.97); color: #d5dde3; border-color: rgba(255,255,255,.16); }
    #hj-toc a { color: #9db4c6; }
    #hj-toc a:hover { color: #fff; }
  }


  #hj-toc li.lvl1 { padding-left: 0; font-weight: 600; margin-top: .3rem; }
  #hj-toc li.lvl2 { padding-left: .25rem; }
  #hj-toc li.lvl3 { padding-left: .7rem; }
  #hj-toc li.lvl4 { padding-left: 1.4rem; }

</style>

{%- comment -%} 简历页（resume.html）：Hydejack 风格两栏版式 {%- endcomment -%}
<style>
  .cv { display: grid; grid-template-columns: 17rem minmax(0, 1fr); gap: 2.5rem; align-items: start; }
  .cv-aside { position: sticky; top: 5.5rem; }
  .cv-main { min-width: 0; }

  .cv-standfirst { margin: 0 0 1.5rem; color: #6b7280; font-size: .9rem; }

  .cv-card {
    margin-bottom: 1.2rem; padding: 1rem 1.1rem;
    border: 1px solid rgba(0, 0, 0, .09); border-radius: .6rem;
    background: #fff;
  }
  .cv-card-title {
    margin: 0 0 .6rem; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase;
    color: #0a7f8c; font-weight: 600;
  }

  .cv-contacts, .cv-skills { list-style: none; margin: 0; padding: 0; }
  .cv-contacts li { display: flex; align-items: flex-start; gap: .55rem; padding: .28rem 0; color: #374151; font-size: .9rem; line-height: 1.45; overflow-wrap: anywhere; }
  .cv-contacts a { text-decoration: none; }
  .cv-icon { flex: 0 0 auto; width: 1rem; height: 1rem; margin-top: .1rem; fill: #0a7f8c; }

  .cv-card .cv-skills li { padding: .45rem 0; font-size: .9rem; line-height: 1.5; }
  .cv-card .cv-skills li + li { border-top: 1px solid rgba(0, 0, 0, .06); }

  .cv-section { margin-bottom: 2rem; }
  .cv-section > h2 {
    margin: 0 0 .5rem; padding-bottom: .4rem;
    font-size: 1.15rem; font-weight: 600; color: #111827;
    border-bottom: 2px solid #4fb1ba;
  }
  .cv-intro, .cv-summary { margin: .2rem 0 .6rem; color: #6b7280; font-size: .9rem; }
  .cv-summary { color: #4b5563; }

  .cv-entry { margin: 1.4rem 0; }
  .cv-entry-head { display: flex; gap: 1rem; align-items: baseline; justify-content: space-between; margin-bottom: .25rem; }
  .cv-entry-head h3 { margin: 0; font-size: 1rem; font-weight: 600; color: #111827; }
  .cv-org { color: #111827; }
  .cv-role { color: #0a7f8c; font-weight: 500; }
  .cv-divider { color: #9ca3af; }
  .cv-date { flex: 0 0 auto; white-space: nowrap; color: #6b7280; font-size: .82rem; font-variant-numeric: tabular-nums; }

  .cv-main ul { margin: .2rem 0 .4rem 1.1rem; padding: 0; }
  .cv-main li { margin-bottom: .45rem; }
  .cv-skills strong { color: #0a7f8c; font-weight: 600; }

  @media (max-width: 52rem) {
    .cv { grid-template-columns: 1fr; gap: 1.5rem; }
    .cv-aside { position: static; }
    .cv-entry-head { flex-direction: column; gap: .1rem; }
  }

  @media (prefers-color-scheme: dark) {
    .cv-card { background: rgba(255, 255, 255, .04); border-color: rgba(255, 255, 255, .14); }
    .cv-standfirst, .cv-intro, .cv-date { color: #9db4c6; }
    .cv-summary { color: #cbd5e1; }
    .cv-section > h2, .cv-entry-head h3, .cv-org { color: #e8eef3; }
    .cv-card-title, .cv-role, .cv-skills strong { color: #6fd3d8; }
    .cv-contacts li { color: #d5dde3; }
    .cv-card .cv-skills li + li { border-top-color: rgba(255, 255, 255, .1); }
  }

  @media print {
    .cv-aside { position: static; }
    .cv-card { box-shadow: none; }
    .cv a { color: inherit; text-decoration: none; }
    .cv { grid-template-columns: 14rem minmax(0, 1fr); gap: 1.5rem; }
  }
</style>

{%- comment -%} 代码块/表格与正文完全齐平（去掉 Hydejack 默认 16px 背景外扩） {%- endcomment -%}
<style>
  .content pre,
  .content table,
  .content .katex-display,
  .content mjx-container[jax][display="true"],
  .content div.highlight > .pre-header {
    margin-left: 0 !important;
    margin-right: 0 !important;
  }
</style>
